     <h1>Age Verification</h1>
     <div class="container">
         <div class="row">
             <label for="name">Enter name:</label>
             <input type="text" class="form-control" id="name">
             <label for="age">Enter age:</label>
             <input type="number" class="form-control" id="age">
         </div>
         <div class="row">
             <button type="button" class="btn" onclick="verifyAge()">Verify</button>
             <button type="button" class="btn" onclick="refresh()">Refresh</button>
         </div>
       </div>

      <script type="text/javascript">
         function verifyAge() {
             var inputAge=document.getElementById('age').value;

             if (inputAge<18) {
                 window.alert('Age not valid to vote.');
             } 
             else {
             	window.alert('Age valid to vote.');
             }

           }
         
           </script>
